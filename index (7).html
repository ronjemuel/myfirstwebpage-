<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>

    <style>
      
.        html, body { 
            height: 100%;
            overflow: hidden; }
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .card {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #F38906, #1e3a8a, #BCF147);
            border-radius: 10px;
            box-shadow: 2px 4px 6px rgba(209, 190, 23, 0.69);
        }

        h1 {
            color: #A7DB6C;
            margin-top: 0;
        }

        p {
            font-family: 'Times New Roman', Times,serif;
            color: #FFFFFF;
            font-size: 18px;
            line-height: 1.6;
            text-align: left;
            margin: 15px 20px;
            text-align: justify;
            text-indent: 50px;
        }

        img {
            height: 250px;
            width: 250px;
            border-radius: 8px;
            margin: 20px 0;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 20px 0;
            cursor: pointer;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:on {
            background-color: #F38906;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>My First Webpage</h1>
        
        <p>
            My name is Jem. I am a BSIT student. I am interested in web development
            and game development. I enjoy editing videos and creating content.
            I also like learning about programming and technology.
            I also have a part time job which is upholstery owned by my cousin-in-law.
        </p>

        <img src="nostalgic2.jpg" alt="My favorite scene">

        <br>

        <button id="myButton" onclick="showMessage()">Click Me</button>
        
        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            alert("Thank you for clicking Sir.");
            document.getElementById('message').innerText = "Thank you for clicking Sir.";
        }
    </script>

</body>
</html>
